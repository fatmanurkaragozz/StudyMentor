name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # config/env.ts, import zamanında zorunlu env değişkenlerini kontrol ediyor
    # (server sessizce ayağa kalkmasın diye kasıtlı bir davranış) - testler gerçek
    # bir DB/SMTP'ye hiç bağlanmadığı (Prisma mock'lanıyor) için bu değerler sahte
    # olabilir, sadece "mevcut mu" kontrolünü geçmeleri yeterli.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/test"
      JWT_SECRET: "ci-test-secret"
      GMAIL_USER: "test@example.com"
      GMAIL_APP_PASSWORD: "test-app-password"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
